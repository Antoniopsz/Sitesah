<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Sabrina ❤️</title>
    <!-- Importando fontes decorativas e elegantes -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #0b0710;
            color: #fff;
            position: relative;
        }

        /* Fundo Fixo Decorado (Estrelinhas / Brilhos) */
        .bg-decorations {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: 
                radial-gradient(white 1px, transparent 0),
                radial-gradient(rgba(255, 51, 102, 0.4) 1px, transparent 0);
            background-size: 50px 50px, 80px 80px;
            background-position: 0 0, 25px 25px;
            opacity: 0.25;
        }

        /* Corações flutuantes de fundo */
        .floating-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 51, 102, 0.2);
            font-size: 1.5rem;
            animation: floatUp 8s infinite linear;
        }

        .heart:nth-child(1) { left: 10%; animation-duration: 7s; font-size: 1.2rem; }
        .heart:nth-child(2) { left: 25%; animation-duration: 9s; animation-delay: 1s; }
        .heart:nth-child(3) { left: 40%; animation-duration: 6s; animation-delay: 2s; font-size: 1.8rem; }
        .heart:nth-child(4) { left: 60%; animation-duration: 10s; animation-delay: 0.5s; }
        .heart:nth-child(5) { left: 75%; animation-duration: 8s; animation-delay: 3s; font-size: 1.4rem; }
        .heart:nth-child(6) { left: 90%; animation-duration: 7.5s; animation-delay: 1.5s; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-105vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            padding: 20px;
            z-index: 1;
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 2;
        }

        /* Animação de transição das flores */
        #transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            visibility: hidden;
        }

        #transition-overlay.active {
            visibility: visible;
        }

        .flower-wave {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, #1a0b1c, #0b0710);
            transition: transform 1.6s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .flower-wave.animate {
            transform: translateY(-100%);
        }

        /* Conteúdo Geral */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 400px;
            gap: 15px;
            z-index: 2;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.6rem;
            font-weight: 700;
            color: #ffb6c1;
            text-shadow: 0 2px 12px rgba(255, 51, 102, 0.3);
            margin-bottom: 5px;
        }

        .counter {
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 14px 18px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin: 5px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            line-height: 1.5;
        }

        .btn-next {
            background: #ff3366;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
            transition: transform 0.2s;
        }

        .btn-next:active {
            transform: scale(0.95);
        }

            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
